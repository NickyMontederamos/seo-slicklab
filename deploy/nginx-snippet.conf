# SEO-slicklab: add inside the server { } block for seo.slicklab.digital, right after the
# server-level "root" line, then run: nginx -t && nginx -s reload
#
# Only the audit page and the three public text files are served. Everything else in the
# folder (engine code, node_modules, bots, lib/, tests) returns 404.
location ~ ^/(?!index\.php$|robots\.txt$|llms\.txt$|sitemap\.xml$|\.well-known/).+ { return 404; }
