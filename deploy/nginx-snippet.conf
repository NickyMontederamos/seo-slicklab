# SEO-slicklab — add inside the server { } block for seo.slicklab.digital, then reload Nginx.
# Only index.php is a public page; hide code, tools, reports and dependencies.
location ~ ^/(mcp|bots|engines|test|deploy|node_modules|reports|outputs)(/|$) { return 404; }
location ~ ^/(package(-lock)?\.json|seo-slicklab\.js|[^/]*\.md|.*\.key\.json|\.env)$ { return 404; }
